name: Deploy H5 Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build H5
        working-directory: frontend
        run: npm run build:h5

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist

          if [ -d "frontend/dist/build/web" ]; then
            cp -a frontend/dist/build/web pages-dist
          elif [ -d "frontend/dist/build/h5" ]; then
            cp -a frontend/dist/build/h5 pages-dist
          else
            echo "Cannot find uni-app H5 build output."
            find frontend/dist -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          if [ ! -f admin/dist/index.html ]; then
            echo "Cannot find admin build output."
            exit 1
          fi

          mkdir -p pages-dist/admin
          cp -a admin/dist/. pages-dist/admin/
          touch pages-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
